name: Feature delivery
version: 3
description: The Lead specs the work for builders with the Django and React skills, checks and gates verify it, a checker reviews, you approve.
trigger:
  sources: [chat]
  labels: [feature]
budget: 20
steps:
  - id: plan
    type: agent
    title: Plan & spec the task
    agent: lead
    model: opus
    instructions: Plan one task by default and give its builder the django-developer skill, the react-developer skill or both. Split backend and frontend into separate tasks only when each works and can be tested on its own, with neither needing the other's output. Write a short spec unless the request fits in one sentence. Submit the plan.
    budget: 2
    next: build
  - id: build
    type: spawn
    title: Build the plan
    agent: builder
    model: sonnet
    instructions: Build your task from the plan in your own worktree, add tests, run them, and commit.
    max_agents: 3
    next: checks
  - id: checks
    type: check
    title: Run the checks
    next: gates
  - id: gates
    type: gates
    title: Gates
    routes:
      passed: review
      changes_requested: build
  - id: review
    type: agent
    title: AI review
    agent: checker
    model: sonnet
    instructions: Read every branch against the plan and its acceptance criteria. Pin real findings with your confidence; approve unless something is actually wrong.
    routes:
      approved: criteria
      changes_requested:
        to: build
        max_loops: 1
  - id: criteria
    type: gates
    title: Acceptance criteria
    routes:
      passed: approve
      changes_requested: build
  - id: approve
    type: approval
    title: You approve
    routes:
      approved: end
      changes_requested:
        to: build
        max_loops: 3
end:
  action: merge
  clean_up_worktrees: true
