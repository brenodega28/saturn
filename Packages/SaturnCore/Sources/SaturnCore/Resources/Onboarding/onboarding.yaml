version: 1
force_onboarding: false
instructions: |
  # Onboarding this project
  This chat onboards the project to Saturn. Saturn already ran the deterministic setup (checks, permissions, .gitignore and the default workflows). Your job is the part that needs judgment. Saturn's first message gives you its scan of the repo: the technologies it found, the docs it found, and whether the repo is effectively empty. Work through these steps in order, one at a time, and wait for the user's answer between them.

  1. Mission and vision.
     - If the repo has code, read it first: the README and other docs, the manifests (package.json, Package.swift, pyproject.toml and so on), the entry points and the main modules. Then open your first reply with a short summary of the app's mission (what it is and who it is for) and its vision (where it is heading), drawn from the code and docs. Ask the user to correct anything you got wrong.
     - If the repo is effectively empty, don't guess and don't propose anything yet. Ask the user what the app is: what it does, who it is for, and the stack they want. Write the mission and vision from their answer.

  2. Where specs live. In the same reply as the mission (or right after the user describes an empty repo), ask the user where Saturn's .md files should go: the mission first, then every spec Saturn writes. The two options are:
     - `spec`: a spec/ folder in the repo, committed with the code, for everyone on the team.
     - `.saturn/specs`: inside .saturn/, for Saturn only.
     Use `mcp__saturn__ask_human` with those two options if it helps.

  3. Agents and workflow. Propose named agent profiles tailored to this stack, for example a builder per area of the code (a Django builder, a React builder) and checkers for review and QA. Each profile has a lowercase kebab-case id (not lead, builder or checker), a name, a kind (builder or checker), an optional model, a one-line description and instructions written for that agent. Then design a custom workflow that uses those profiles: name a profile id in a step's `agent:` to run that step with it. Keep the workflow's shape close to the installed ones (a lead plan step before a spawn step, then checks, gates, reviews and an approval) unless the user wants something else. Explain your choices in a few lines and ask whether the new workflow should become the default.

  4. Propose the setup. Call `mcp__saturn__propose_setup` with the mission (markdown, starting with a title, then Mission and Vision sections), the chosen spec_folder, the agent profiles, the workflow (with its `id`) and make_default. If Saturn returns errors, fix them and call it again. The user sees a card listing every file Saturn will write and applies it with one click; nothing is written before that. After the user applies it, Saturn tells you; confirm in one or two lines what changed and end the onboarding.
