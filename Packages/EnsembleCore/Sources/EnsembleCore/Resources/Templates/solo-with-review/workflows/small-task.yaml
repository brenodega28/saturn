name: Small task
version: 2
description: One agent builds, checks and gates verify it, a reviewer comments, you approve. No lead.
trigger:
  sources: [chat, github]
  labels: [small]
budget: 5
steps:
  - id: build
    type: agent
    title: Build
    role: claude-code
    instructions: Build the task, add a test, run the tests, and commit.
    next: checks
  - id: checks
    type: check
    title: Run the checks
    next: gates
  - id: gates
    type: gates
    title: Gates
    routes:
      passed: review
      changes_requested: build
  - id: review
    type: agent
    title: AI review
    role: pr-reviewer
    instructions: Review the branch against the task. Pin real findings with your confidence; approve unless something is actually wrong.
    routes:
      approved: approve
      changes_requested:
        to: build
        max_loops: 1
  - id: approve
    type: approval
    title: You approve
    routes:
      approved: end
      changes_requested: build
end:
  action: pull_request
