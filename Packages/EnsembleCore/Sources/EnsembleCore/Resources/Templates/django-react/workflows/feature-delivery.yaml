name: Feature delivery
version: 1
description: The lead splits the work between Django and React developers, the PR Reviewer checks it, QA tests, you approve.
trigger:
  sources: [chat, github]
  labels: [feature]
budget: 20
steps:
  - id: plan
    type: agent
    title: Plan & split the task
    role: tech-lead
    instructions: Break the request into backend tasks for django-developer and frontend tasks for react-developer that don't touch the same files, and submit the plan.
    budget: 2
    next: build
  - id: build
    type: spawn
    title: Build in parallel
    role: django-developer
    instructions: Build your task from the plan in your own worktree, run the tests, and commit.
    max_agents: 3
    next: review
  - id: review
    type: agent
    title: Review the code
    role: pr-reviewer
    instructions: Read every branch against the plan. Approve, or request changes naming the agent and file.
    routes:
      approved: qa
      changes_requested:
        to: build
        max_loops: 3
  - id: qa
    type: agent
    title: Test end to end
    role: qa-engineer
    instructions: Run the Django and React test suites on the merged work, exercise the changed behavior, and report passed or failed.
    routes:
      passed: approve
      failed:
        to: build
        max_loops: 2
  - id: approve
    type: approval
    title: You approve the pins
    routes:
      approved: end
      changes_requested:
        to: build
        max_loops: 3
end:
  action: pull_request
  clean_up_worktrees: true
