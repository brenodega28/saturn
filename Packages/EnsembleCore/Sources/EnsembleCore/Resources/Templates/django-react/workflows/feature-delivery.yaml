name: Feature delivery
version: 2
description: The lead specs the work for Django and React developers, checks and gates verify it, the PR Reviewer comments, you approve.
trigger:
  sources: [chat, github]
  labels: [feature]
budget: 20
steps:
  - id: plan
    type: agent
    title: Plan & spec the task
    role: tech-lead
    instructions: Break the request into backend tasks for django-developer and frontend tasks for react-developer that don't touch the same files, with a short spec unless the request fits in one sentence. Submit the plan.
    budget: 2
    next: build
  - id: build
    type: spawn
    title: Build in parallel
    role: django-developer
    instructions: Build your task from the plan in your own worktree, add tests, run them, and commit.
    max_agents: 3
    next: checks
  - id: checks
    type: check
    title: Run the checks
    next: gates
  - id: gates
    type: gates
    title: Gates
    routes:
      passed: review
      changes_requested: build
  - id: review
    type: agent
    title: AI review
    role: pr-reviewer
    instructions: Read every branch against the plan and its acceptance criteria. Pin real findings with your confidence; approve unless something is actually wrong.
    routes:
      approved: approve
      changes_requested:
        to: build
        max_loops: 1
  - id: approve
    type: approval
    title: You approve
    routes:
      approved: end
      changes_requested:
        to: build
        max_loops: 3
end:
  action: pull_request
  clean_up_worktrees: true
