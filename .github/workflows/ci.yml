name: CI

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test EnsembleCore
        run: swift test --package-path Packages/EnsembleCore

      - name: Build EnsembleUI
        run: swift build --package-path Packages/EnsembleUI
