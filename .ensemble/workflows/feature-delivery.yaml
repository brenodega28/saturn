name: Feature delivery
version: 1
description: The lead plans, developers build it, the lead reviews, QA tests, you approve.
trigger:
  sources:
  - chat
  - github
  labels:
  - feature
steps:
- id: plan
  type: agent
  title: Plan & split the task
  agent: lead
  model: opus
  instructions: Plan one task by default. Split into more tasks only when every task works and can be tested on its own, with none needing another's output. Assign a role to each task and submit the plan.
  next: build
- id: build
  type: spawn
  title: Build the plan
  agent: builder
  model: opus
  instructions: Build your task from the plan in your own worktree, run the tests, and commit.
  max_agents: 4
  next: review
- id: review
  type: agent
  title: Review the code
  agent: lead
  model: opus
  instructions: Read every branch against the plan. Approve, or request changes naming the agent and file.
  routes:
    changes_requested:
      to: build
      max_loops: 3
    approved: qa
- id: qa
  type: agent
  title: Test end to end
  agent: checker
  model: opus
  instructions: Run the unit and end-to-end suites on the merged work and report passed or failed.
  routes:
    passed: approve
    failed:
      to: build
      max_loops: 2
- id: approve
  type: approval
  title: You approve the pins
  routes:
    approved: end
    changes_requested:
      to: build
      max_loops: 3
end:
  action: pull_request
  clean_up_worktrees: true
