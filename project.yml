name: Ensemble
options:
  bundleIdPrefix: dev.monoliti
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

packages:
  EnsembleCore:
    path: Packages/EnsembleCore
  EnsembleUI:
    path: Packages/EnsembleUI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0

targets:
  Ensemble:
    type: application
    platform: macOS
    sources:
      - path: Ensemble
        excludes:
          - Daemon/*.plist
      - path: Ensemble/Daemon/dev.monoliti.ensembled.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    postCompileScripts:
      - name: Embed ensembled
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          PACKAGE="$SRCROOT/Packages/EnsembleCore"
          if [ "$CONFIGURATION" = "Release" ]; then SWIFT_CONFIG=release; else SWIFT_CONFIG=debug; fi
          BUILD=(/usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" /usr/bin/xcrun swift build --package-path "$PACKAGE" -c "$SWIFT_CONFIG" --product ensembled)
          "${BUILD[@]}"
          BIN="$("${BUILD[@]}" --show-bin-path)"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          rm -rf "$DEST/ensembled" "$DEST/EnsembleCore_EnsembleCore.bundle"
          cp -f "$BIN/ensembled" "$DEST/ensembled"
          cp -R "$BIN/EnsembleCore_EnsembleCore.bundle" "$DEST/EnsembleCore_EnsembleCore.bundle"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DEST/EnsembleCore_EnsembleCore.bundle"
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp=none --identifier dev.monoliti.ensembled "$DEST/ensembled"
          fi
    dependencies:
      - package: EnsembleCore
      - package: EnsembleUI
      - package: Sparkle
      - package: SwiftTerm
    entitlements:
      path: Ensemble/Ensemble.entitlements
      properties:
        com.apple.security.app-sandbox: false
    info:
      path: Ensemble/Info.plist
      properties:
        CFBundleDisplayName: Ensemble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.monoliti.Ensemble.chat-link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - ensemble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.monoliti.Ensemble
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Ensemble:
    build:
      targets:
        Ensemble: all
    run:
      config: Debug
    archive:
      config: Release
