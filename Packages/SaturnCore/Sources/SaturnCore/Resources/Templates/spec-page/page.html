<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>
:root {
  --page: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --muted: rgba(60, 60, 67, 0.74);
  --hair: rgba(0, 0, 0, 0.08);
  --accent: #0066cc;
  --code: #f5f5f7;
  --draft: var(--accent);
  --approved: #8f49ff;
  --progress: #7059ff;
  --done: #228178;
  --rejected: #e80042;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #000000;
    --card: #0a0a0c;
    --text: #f5f5f7;
    --muted: rgba(235, 235, 245, 0.62);
    --hair: rgba(255, 255, 255, 0.08);
    --accent: #8ec5ff;
    --code: #121216;
    --approved: #c9a7ff;
    --progress: #a99bff;
    --done: #4fd1c5;
    --rejected: #ff5c8a;
  }
}
* { box-sizing: border-box; }
html { background: var(--page); }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
}
main { max-width: 860px; margin: 0 auto; padding: 40px 24px 64px; }
header { margin-bottom: 28px; }
h1 { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 28px; line-height: 1.25; margin: 0 0 10px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.badge { font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
.status-draft { color: var(--draft); }
.status-approved { color: var(--approved); }
.status-in-progress { color: var(--progress); }
.status-done { color: var(--done); }
.status-rejected { color: var(--rejected); }
section {
  background: var(--card);
  border: 1px solid var(--hair);
  border-radius: 14px;
  padding: 18px 22px;
  margin: 0 0 16px;
  min-width: 0;
}
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }
ul { margin: 0; padding-left: 20px; }
li { margin: 4px 0; overflow-wrap: anywhere; }
code { font: 13px/1.5 'SF Mono', ui-monospace, monospace; background: var(--code); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
pre code { padding: 0; background: none; }
ol.criteria { list-style: none; padding: 0; margin: 0; counter-reset: criterion; }
ol.criteria li {
  counter-increment: criterion;
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid var(--hair);
  margin: 0;
}
ol.criteria li:first-child { border-top: none; }
ol.criteria li::before { content: counter(criterion); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
ol.criteria li.checked .text { color: var(--muted); text-decoration: line-through; }
.workers li { list-style: none; margin-left: -20px; }
.role { color: var(--muted); font-size: 13px; }
.reason { color: var(--muted); }
h3 { font-size: 14px; margin: 16px 0 6px; }
ol.steps { margin: 0 0 12px; padding-left: 22px; }
.table { overflow-x: auto; margin: 0 0 12px; }
table.workers { width: 100%; border-collapse: collapse; font-size: 14px; }
table.workers th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
table.workers th, table.workers td { padding: 6px 8px; border-top: 1px solid var(--hair); vertical-align: top; overflow-wrap: anywhere; }
table.workers thead th { border-top: none; }
.total { margin-top: 4px; }
.approve { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hair); }
#spec-approve {
  font: inherit;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: 9px;
  padding: 8px 18px;
  cursor: pointer;
}
#spec-approve:hover { filter: brightness(1.08); }
#spec-approve:disabled { opacity: .6; cursor: default; }
.hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
{{content}}
</main>
</body>
</html>
