name: Saturn
options:
  bundleIdPrefix: dev.monoliti
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

packages:
  SaturnCore:
    path: Packages/SaturnCore
  SaturnUI:
    path: Packages/SaturnUI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0

targets:
  Saturn:
    type: application
    platform: macOS
    sources:
      - path: Saturn
        excludes:
          - Daemon/*.plist
      - path: Saturn/Daemon/dev.monoliti.saturnd.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    postCompileScripts:
      - name: Embed saturnd
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          PACKAGE="$SRCROOT/Packages/SaturnCore"
          if [ "$CONFIGURATION" = "Release" ]; then SWIFT_CONFIG=release; else SWIFT_CONFIG=debug; fi
          BUILD=(/usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" /usr/bin/xcrun swift build --package-path "$PACKAGE" -c "$SWIFT_CONFIG" --product saturnd)
          "${BUILD[@]}"
          BIN="$("${BUILD[@]}" --show-bin-path)"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          rm -rf "$DEST/saturnd" "$DEST/SaturnCore_SaturnCore.bundle"
          cp -f "$BIN/saturnd" "$DEST/saturnd"
          cp -R "$BIN/SaturnCore_SaturnCore.bundle" "$DEST/SaturnCore_SaturnCore.bundle"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DEST/SaturnCore_SaturnCore.bundle"
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp=none --identifier dev.monoliti.saturnd "$DEST/saturnd"
          fi
    dependencies:
      - package: SaturnCore
      - package: SaturnUI
      - package: Sparkle
      - package: SwiftTerm
    entitlements:
      path: Saturn/Saturn.entitlements
      properties:
        com.apple.security.app-sandbox: false
    info:
      path: Saturn/Info.plist
      properties:
        CFBundleDisplayName: Saturn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: ""
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.monoliti.Saturn.chat-link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - saturn
              - ensemble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.monoliti.Saturn
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SaturnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SaturnTests
    dependencies:
      - target: Saturn
      - package: SaturnCore
      - package: SaturnUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.monoliti.SaturnTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Saturn.app/Contents/MacOS/Saturn
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Saturn:
    build:
      targets:
        Saturn: all
    test:
      targets:
        - SaturnTests
    run:
      config: Debug
    archive:
      config: Release
